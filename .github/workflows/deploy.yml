# Build HYPEBOUND and publish it to GitHub Pages.
#
# The client is a pure static bundle — every card, encounter and balance number
# is imported at build time (`src/engine/content.ts`), and routing is hash-based
# — so Pages can serve it with no server, no rewrite rules and no SPA fallback.
#
# The gate before publishing is deliberate. `npm run build` runs `tsc --noEmit`
# first, and the test suite runs ahead of both: this is the last point at which
# a mistake is private. Everything past it is a public URL.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race to publish. Queue instead of cancelling, so a green
# commit is never dropped in favour of a later one that might be red.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 20 resolves to the latest 20.x, which clears sharp's >=20.9.0 floor.
      # Anything older than that will fail at `npm ci`, not at build time.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Turns Pages on for the repository if it is not already.
      #
      # `enablement` defaults to false, in which case the action only *reads*
      # the Pages config and fails when there is none — which is exactly the
      # situation on a repository that has never deployed. Opting in is what
      # makes the very first push work without a manual visit to Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # Re-encoding 338 images on every push would be its own bug.
      #
      # `vite build` runs `scripts/encode-assets.mjs`, which turns the owner's
      # PNG masters into the WebP that actually ships. From cold that is about
      # 80 seconds; from a warm cache it is a few seconds of hashing. The cache
      # is keyed by the *content* of public/assets, so a checkout's fresh mtimes
      # cannot invalidate it — and `restore-keys` means a push that repaints one
      # card restores the previous cache and re-encodes exactly that one card,
      # because the encoder's own index is keyed per file by SHA-1.
      #
      # Free: GitHub gives every repository 10 GB of Actions cache and this is
      # about 16 MB. Bump the version prefix by hand if the cache ever needs
      # discarding wholesale; POLICY_VERSION in the encoder handles the ordinary
      # case of a quality setting changing.
      - name: Restore the asset encode cache
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: asset-encode-v1-${{ hashFiles('public/assets/**', 'scripts/encode-assets.mjs') }}
          restore-keys: asset-encode-v1-

      # Runs before the build so a broken rule fails the job for the honest
      # reason, rather than surfacing as a confusing type error downstream.
      # CI is also the first machine to build this on a case-sensitive
      # filesystem, which is worth knowing about here rather than in production.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
