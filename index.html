<!doctype html>
<html lang="en" class="hb-boot">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0614" />
    <title>HYPEBOUND</title>
    <!--
      The real mark. Every one of these is generated from
      public/assets/brand/hb-mark-master.png by `node scripts/make-brand-icons.mjs`
      — six independent generations of "the same logo" would be six slightly
      different logos, so there is one master and the rest are downscales.

      These replaced an inline SVG placeholder. The inline version cost no
      request, which was the right trade while the mark did not exist; now that
      it does, 713 bytes for a 16px PNG is a better one than a data URI of a
      shape that is not the logo.

      Relative hrefs, not absolute. `vite.config.ts` sets base "./" so the game
      can be served from a subpath, and a leading slash here would ask for
      /favicon-32.png at the domain root and quietly get a 404.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <!--
      The wordmark is the first picture of the product, so it is asked for in the
      head rather than discovered when the boot plate is parsed a dozen lines
      later. `as="image"` puts it in the same high-priority bucket as the
      stylesheet instead of behind the module graph.
    -->
    <link rel="preload" as="image" href="./assets/brand/hb-wordmark.png" />
    <link rel="stylesheet" href="/src/ui/theme/base.css" />

    <!--
      ## The first frame of the product, painted by the document

      Measured before this existed, on a *warm* reload with every module in the
      HTTP cache and an RTX 2060 doing the drawing: 932 milliseconds at mean
      luminance 5.8/255 — the bare `--bg-void` fill from `base.css` — before the
      first pixel of the returning sting. Nothing was broken. The page had
      painted; there was simply nothing in the body to paint but a colour, and
      every millisecond of module evaluation, content validation and shell
      construction happened behind it. On GitHub Pages over a real network it is
      longer, and it is the frame a stranger judges the game on.

      So the boot state is *in the document*. No script runs to produce it, no
      stylesheet outside the one already in the head is consulted, and the only
      request it adds is the wordmark it draws — which the intro and the lobby
      header were both going to ask for anyway, so it is a request moved earlier
      rather than a request added. A black first frame stops being a thing that
      is merely short and becomes a thing that is structurally impossible.

      What it paints is the *hub room*, at the same 315° key as everything else
      and from the same three radial washes `atmosphere.ts` uses, so the handover
      is a brightening rather than a swap: by the time `main.ts` removes
      `.hb-boot` there is a real atmosphere layer underneath drawing very nearly
      the same picture. `main.ts` takes the class off; `base.css` and the
      atmosphere own every pixel from then on.

      §3's "idle is never dead" applies to a loading screen more than to
      anything else, so the mark breathes on a 3.6s period at very low
      amplitude — one compositor-only `opacity`/`transform` animation on one
      element, which is affordable even while the module graph is being
      evaluated on the main thread.

      ## And "very low amplitude" turned out to mean "none"

      Filmed on a genuine cold boot and differenced at the reference's own 200ms
      grid, this plate measured **0.00–0.23 mean delta from 486ms to 1433ms**
      against a Hearthstone idle floor whose *minimum* is 0.50 and whose median
      is 1.71. It was not still by a little. It was four to twenty times more
      frozen than the reference game is at its quietest, for the first second and
      a half a stranger ever sees, and the reason is geometry rather than intent:
      the mark is about 4% of the frame and a 0.16 opacity swing over 1.8s moves
      roughly 0.065 of mean delta. Everything in the note above was true and the
      number it produced was zero.

      What clears the floor is **area in motion**, so a raking light was added:
      one soft band crossing the plate on a 5.2s traverse. A band 300px wide
      travelling 80px per 200ms changes about a tenth of the frame each sample,
      which is the order of magnitude the reference sits at — and it is the right
      *thing* as well as the right size, because §3a says loading is part of the
      world and no spinner. A light moving across a dark room reads as the room
      being lit, not as a progress widget. The mark's own breath was doubled at
      the same time and moved to a 3.0s period.

      Everything here is still `transform` and `opacity` on four elements, which
      is what makes it affordable on a thread that is busy parsing the game.
    -->
    <style>
      .hb-boot,
      .hb-boot body {
        background-color: #05030b;
      }

      #hb-boot-plate {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        /* Same recipe as `.atm-wash`: grainless here, because the generator is
           a canvas in `texture.ts` and this must not wait for a script. */
        background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;
        background-image:
          radial-gradient(78% 62% at 18% 4%, rgb(88 78 132 / 0.2), transparent 66%),
          radial-gradient(62% 52% at 82% 16%, rgb(126 86 118 / 0.13), transparent 70%),
          radial-gradient(96% 62% at 50% 112%, rgb(70 100 130 / 0.11), transparent 62%),
          linear-gradient(135deg, #0c0b1c 0%, #0a0716 46%, #05030b 100%);
        opacity: 1;
        transition: opacity 420ms cubic-bezier(0.4, 0, 1, 1);
      }

      /* `main.ts` drops the class; the plate fades on the compositor and is
         removed a beat later. Kept as a class swap rather than a removal so
         nothing has to be re-queried if the plate is already gone. */
      html:not(.hb-boot) #hb-boot-plate {
        opacity: 0;
      }

      #hb-boot-mark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(38vw, 44vh, 420px);
        aspect-ratio: 3 / 1;
        margin: -6vh 0 0 0;
        transform: translate3d(-50%, -50%, 0);
        background: url("./assets/brand/hb-wordmark.png") center / contain no-repeat;
        opacity: 0.34;
        will-change: opacity, transform;
        animation: hb-boot-breathe 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes hb-boot-breathe {
        0%,
        100% {
          opacity: 0.2;
          transform: translate3d(-50%, -50%, 0) scale(0.982);
        }
        50% {
          opacity: 0.56;
          transform: translate3d(-50%, -50%, 0) scale(1.008);
        }
      }

      /*
        The raking light. It is wider than it looks — the visible band is the
        middle third of a very soft ramp — and it travels the whole plate, so
        every column of the frame is changing value at some point in the cycle.
        That is what puts the measurement in the same order as the reference;
        a small bright object breathing cannot, whatever its amplitude.
      */
      #hb-boot-rake {
        position: absolute;
        inset: -20% -55%;
        background: linear-gradient(
          78deg,
          rgba(181, 108, 255, 0) 36%,
          rgba(198, 168, 255, 0.14) 47%,
          rgba(226, 205, 255, 0.2) 50%,
          rgba(198, 168, 255, 0.14) 53%,
          rgba(181, 108, 255, 0) 64%
        );
        will-change: transform;
        /*
          Linear, and it is the one place in the game where linear is right.
          §3 reserves it for progress bars — and that is exactly what this is:
          a light crossing a room at a constant rate while the game loads. An
          eased traverse spends its first and last 20% barely moving, which
          measured 0.14–0.52 in the first second, i.e. back under the floor
          during the very window this exists to fill.
        */
        animation: hb-boot-rake 5.2s linear infinite;
      }

      @keyframes hb-boot-rake {
        0% {
          transform: translate3d(-42%, 0, 0);
        }
        100% {
          transform: translate3d(42%, 0, 0);
        }
      }

      /* The one horizontal line of light, on the same seam the curtain uses, so
         the boot plate and the curtain are recognisably the same piece of
         furniture rather than two loading states. */
      #hb-boot-seam {
        position: absolute;
        left: 12%;
        right: 12%;
        top: 50%;
        height: 1px;
        margin-top: 5vh;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgb(181 108 255 / 0.28) 22%,
          rgb(226 205 255 / 0.5) 50%,
          rgb(181 108 255 / 0.28) 78%,
          transparent 100%
        );
        opacity: 0.8;
        will-change: opacity;
        animation: hb-boot-seam 3.6s cubic-bezier(0.4, 0, 0.2, 1) 180ms infinite;
      }

      @keyframes hb-boot-seam {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #hb-boot-mark,
        #hb-boot-seam,
        #hb-boot-rake {
          animation: none;
        }
        #hb-boot-mark {
          opacity: 0.34;
        }
        /* The rake stops travelling and parks where it lights the mark, so a
           reduced-motion boot still gets a room with a light in it rather than
           a flat field. The decorative layer dies; the composition does not. */
        #hb-boot-rake {
          transform: translate3d(0, 0, 0);
        }
      }
    </style>
  </head>
  <body>
    <!--
      Before `#app`, so it is behind every screen in document order as well as
      by z-index, and outside it, so the router cannot remove it by accident.
    -->
    <div id="hb-boot-plate" aria-hidden="true">
      <!-- Behind the mark and the seam: it is the light in the room, and the
           two things it lights are drawn after it. -->
      <div id="hb-boot-rake"></div>
      <div id="hb-boot-mark"></div>
      <div id="hb-boot-seam"></div>
    </div>
    <div id="app" aria-live="polite"></div>
    <div id="rotate-overlay" hidden>
      <div class="rotate-overlay-inner">
        <!--
          The `refresh` drawing from `src/ui/art/uiIcons.ts`, pasted rather than
          imported. This is the one screen in the game that is shown before any
          module has evaluated, so it cannot call `icon("refresh")` — and the
          `⟳` it used to hold rendered in whatever font the OS supplied, at the
          wrong weight, and was tofu on any device missing the code point. Module
          C of the foundation contract deletes Unicode-as-icon everywhere else;
          this was the last one, and it was on the first thing a phone player is
          ever shown.

          24px grid, 1.75px stroke, `currentColor` — identical to the other 107.
          The path is `ART.refresh`; if that drawing is ever revised, revise it
          here too, which is why the source is named.
        -->
        <svg
          class="rotate-icon"
          viewBox="0 0 24 24"
          width="40"
          height="40"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          focusable="false"
          aria-hidden="true"
        >
          <path d="M16.2 4.72 A8.4 8.4 0 1 1 7.8 4.72" />
          <path d="M4.4 4.4 L7.8 4.72 L6.4 7.8" />
        </svg>
        <p>Rotate your device to landscape to play HYPEBOUND.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
