# HYPEBOUND authoritative match server.
#
# Everything declared here is inside Cloudflare's free plan, and the two lines
# that keep it there are marked below. If a change to this file would start
# charging, it needs saying out loud before it lands.

name = "hypebound"
main = "src/worker.ts"
compatibility_date = "2025-11-01"

# Free: 100k requests/day and 10ms CPU per invocation on Workers, plus the
# Durable Objects request allowance. A match is a long-lived socket rather than
# a request per action, so the request count tracks *matches*, not *intents* —
# which is the whole reason a DO is cheaper here than a polling API.

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Durable Objects — one object per match. Multiplayer §14.2's "one match = one
# room", except the room is addressed by Cloudflare instead of by a Redis
# directory, and its storage replaces the specced Redis journal.
# ---------------------------------------------------------------------------

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[durable_objects.bindings]]
name = "CASUAL_QUEUE"
class_name = "CasualQueue"

[[durable_objects.bindings]]
name = "PLAYER_RECORD"
class_name = "PlayerRecord"

[[durable_objects.bindings]]
name = "SAVE_STORE"
class_name = "SaveStore"

[[migrations]]
tag = "v1"
# `new_sqlite_classes`, NOT `new_classes`. This is the line that decides whether
# the project costs money: SQLite-backed Durable Objects are available on the
# free plan, and the older key-value-backed ones are not. They are also not
# interchangeable later — the storage backend of a class is fixed at the
# migration that created it, so getting this wrong means a new class name and a
# data migration rather than a config edit.
new_sqlite_classes = ["MatchRoom", "CasualQueue"]

# A NEW tag, not an edit to v1.
#
# Wrangler tracks applied migrations by tag, and v1 has already run against the
# deployed worker. Adding `PlayerRecord` to that list would have changed a
# migration the server considers spent: the tag is already applied, so the new
# class would never get its migration and the binding would fail at runtime
# rather than at deploy. Every later class gets its own tag, for ever.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["PlayerRecord"]

# v3 — cloud saves (§12). Its own tag for the same reason v2 got one: v2 is
# already applied to the deployed worker, so appending SaveStore to it would
# describe a migration the server considers spent, and the class would never be
# created. `wrangler deploy --dry-run` catches this; it caught it for v2.
#
# Still `new_sqlite_classes`, still the line that keeps this free.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["SaveStore"]

# ---------------------------------------------------------------------------
# Public configuration. Nothing secret lives here.
#
# Verifying a Supabase JWT needs only the project's public JWKS, so the server
# holds no Supabase key at all — there is no service-role secret to leak,
# because there is nothing it would be used for. See `.dev.vars.example`.
# ---------------------------------------------------------------------------

[vars]
# The Supabase project (§10). Not a secret and deliberately committed: the same
# URL is in the client bundle, and token verification uses only the project's
# **public** JWKS at /auth/v1/.well-known/jwks.json — this server holds no
# Supabase credential of any kind.
#
# Confirmed serving one ES256 / P-256 key, which is what `auth/supabase.ts`
# requires; an HS256 project is refused, because verifying HS256 needs the key
# that mints tokens.
SUPABASE_URL = "https://vnvaqwbnmawcnvhodbel.supabase.co"
# Browser origins allowed to open a socket. GitHub Pages is the client's home;
# localhost is for `npm run dev` against a real server.
ALLOWED_ORIGINS = "https://dylannfontus.github.io,http://localhost:5173"
# §10.4 build binding. Overridden at deploy time with the commit sha; "dev" is
# what you get when a human runs `wrangler deploy` from a laptop, and saying so
# is better than a version number nobody bumped.
BUILD = "dev"
